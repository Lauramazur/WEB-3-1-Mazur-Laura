
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evidența elevilor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="text-center mb-4">Evidența elevilor</h1>
        <div class="card shadow mb-4">
            <div class="card-body">
                <h4 class="mb-3">Adaugă un elev</h4>
                <form id="formularElev">
                    <div class="mb-3">
                        <label for="nume" class="form-label">
                            Nume și prenume
                        </label>
                        <input type="text" id="nume" class="form-control"
                               placeholder="Introdu numele și prenumele">
                    </div>
                    <div class="mb-3">
                        <label for="varsta" class="form-label">Vârsta</label>
                        <input type="number" id="varsta" class="form-control"
                               placeholder="Introdu vârsta">
                    </div>
                    <div class="mb-3">
                        <label for="grupa" class="form-label">Grupa / Clasa</label>
                        <input type="text" id="grupa" class="form-control"
                               placeholder="Ex: DAW-241">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" id="email" class="form-control"
                               placeholder="exemplu@gmail.com">
                    </div>
                    <button type="submit" class="btn btn-primary">
                        Adaugă elev
                    </button>
                </form>
                <div id="mesaj" class="mt-3"></div>
            </div>
        </div>
        <h3 class="mb-3">Lista elevilor</h3>
        <div id="listaElevi" class="row g-3"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
